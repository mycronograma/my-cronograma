services:
  cockroach:
    image: cockroachdb/cockroach:v23.2.13
    container_name: nexora-cockroach
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - nexora-cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "./cockroach", "sql", "--insecure", "--execute", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nexora-cockroach-data:
